name: Terraform Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # subir el SARIF de Checkov a la pestaña Security

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init + validate (module root)
        run: |
          terraform init -input=false -backend=false
          terraform validate

      - name: Terraform init + validate (examples/basic)
        working-directory: examples/basic
        run: |
          terraform init -input=false
          terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: tflint
        env:
          # sin esto, tflint --init pega contra la API pública de GitHub sin
          # autenticar (60 req/hora por IP, compartida entre todos los runners
          # de GitHub Actions) para bajar el plugin de aws - rate limit real,
          # no hipotético (nos rompió un run en azure-virtual-network el
          # 2026-09-05). Con el token del propio job sube a 5000/hora.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive

      - name: Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false # bloqueante — findings aceptados quedan documentados con #checkov:skip inline
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Subir resultados de Checkov a la pestaña Security
        # correr también cuando Checkov falla (soft_fail: false) - ahí es
        # cuando más importa que quede el SARIF. Pero NO si un paso anterior
        # (tflint, validate) ya falló y Checkov ni llegó a correr - ahí
        # results.sarif no existe y este step rompía con "Path does not
        # exist" (nos pasó en azure-virtual-network el 2026-09-05, tflint
        # pegó un rate limit y tapó el error real).
        if: always() && steps.checkov.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
